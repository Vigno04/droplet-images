name: Build and Push Modified Droplets

on:
  push:
    branches:
      - main
    paths:
      - 'dockerfile-*'
      - 'src/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.set-matrix.outputs.dockerfiles }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            dockerfile-*
            src/**

      - name: Set up matrix
        id: set-matrix
        run: |
          DOCKERFILES=()

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" == dockerfile-* ]]; then
              # Direct dockerfile change
              DOCKERFILES+=("$file")
            elif [[ "$file" == src/ubuntu/install/* ]]; then
              # Extract app name from src path: src/ubuntu/install/<app>/...
              APP=$(echo "$file" | cut -d'/' -f4)
              # Map common naming differences (underscores to hyphens)
              APP_HYPHEN=$(echo "$APP" | tr '_' '-')
              DOCKERFILE="dockerfile-${APP_HYPHEN}"
              if [ -f "$DOCKERFILE" ]; then
                DOCKERFILES+=("$DOCKERFILE")
              fi
            elif [[ "$file" == src/common/* || "$file" == src/ubuntu/install/misc/* || "$file" == src/ubuntu/install/gtk/* || "$file" == src/ubuntu/xfce/* ]]; then
              # Common/shared files: rebuild all dockerfiles
              for df in dockerfile-*; do
                DOCKERFILES+=("$df")
              done
              break
            fi
          done

          # Deduplicate
          UNIQUE=$(printf '%s\n' "${DOCKERFILES[@]}" | sort -u | tr '\n' ' ')

          if [ -n "$UNIQUE" ]; then
            FILES_JSON=$(echo "$UNIQUE" | tr ' ' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "dockerfiles=$FILES_JSON" >> $GITHUB_OUTPUT
          else
            echo "dockerfiles=[]" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.dockerfiles != '[]' && needs.detect-changes.outputs.dockerfiles != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.detect-changes.outputs.dockerfiles) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract image name
        id: extract-name
        run: |
          FILENAME="${{ matrix.dockerfile }}"
          IMAGE_NAME="${FILENAME#dockerfile-}"
          echo "image=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Determine Platforms
        id: determine-platforms
        run: |
          PLATFORMS="linux/amd64,linux/arm64"
          EXCLUDE_ARM="blender discord edge hunchly parsec qbittorrent signal steam ubuntu-focal-deluxe ubuntu-jammy-deluxe ubuntu-noble-deluxe wine"
          for item in $EXCLUDE_ARM; do
            if [ "${{ env.image }}" == "$item" ]; then
              PLATFORMS="linux/amd64"
              break
            fi
          done
          echo "platforms=$PLATFORMS" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: ${{ env.platforms }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ env.image }}:latest
            ghcr.io/${{ env.OWNER }}/${{ env.image }}:develop
          file: ./${{ matrix.dockerfile }}

